server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite SPA with React Router — client-side routes must fall back to
    # index.html instead of 404ing on a hard refresh/direct navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reasonable caching for hashed build assets; index.html itself is not
    # hashed so it's excluded from this location block and keeps nginx's
    # default (no long-lived caching) behavior.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
