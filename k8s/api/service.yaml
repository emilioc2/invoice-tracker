# ClusterIP by default — reach it from the host during a kind/minikube demo via
# `kubectl -n invoicetracker port-forward svc/api 5100:5100`.
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: invoicetracker
spec:
  selector:
    app: api
  ports:
    - port: 5100
      targetPort: 5100
