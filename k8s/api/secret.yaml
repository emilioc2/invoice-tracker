# PLACEHOLDER — artifact only, demonstrating manifest structure (see requirements.md's
# "Kubernetes" row: these manifests are runnable against kind/minikube, never a live cluster).
# Jwt__Secret below is the same dev-only placeholder already committed in
# backend/src/InvoiceTracker.Api/appsettings.Development.json — fine for a throwaway
# kind/minikube demo, never for a real deployment. ConnectionStrings__DefaultConnection's
# password matches postgres/secret.yaml's dev-only value. Resend__ApiKey is left empty, same as
# local/compose dev — the app's IEmailSender falls back to NoOpEmailSender when unset. In a real
# deployment every value here would come from a secrets manager or be created out-of-band, not
# committed.
apiVersion: v1
kind: Secret
metadata:
  name: api-secret
  namespace: invoicetracker
type: Opaque
stringData:
  Jwt__Secret: dev-only-placeholder-secret-not-for-production-use-1234567890
  ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=invoicetracker;Username=invoicetracker;Password=invoicetracker"
  Resend__ApiKey: ""
