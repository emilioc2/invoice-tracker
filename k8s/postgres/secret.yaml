# PLACEHOLDER — artifact only, demonstrating manifest structure (see requirements.md's
# "Kubernetes" row: these manifests are runnable against kind/minikube, never a live cluster).
# This value matches docker-compose.yml's dev-only Postgres password and must never be the real
# production credential. In a real deployment this Secret would be created out-of-band (e.g.
# `kubectl create secret generic` or a secrets manager integration), not committed with its data.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: invoicetracker
type: Opaque
stringData:
  POSTGRES_PASSWORD: invoicetracker
