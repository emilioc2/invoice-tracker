name: Backend CI

# Per requirements.md's CI row: dotnet build/test on PR, build + push the API image to GHCR.
# The image push is restricted to pushes on main (not PRs) — pushing images from arbitrary PRs
# (including forks, which get a read-only GITHUB_TOKEN with no packages:write) is both insecure
# and would tag ghcr.io/<owner>/invoice-tracker-api:latest from unmerged code.
on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore InvoiceTracker.sln

      - name: Build
        run: dotnet build InvoiceTracker.sln --no-restore --configuration Release

      - name: Unit tests
        run: dotnet test tests/InvoiceTracker.UnitTests/InvoiceTracker.UnitTests.csproj --no-build --configuration Release

      # Testcontainers spins up a real Postgres container per architecture.md's "Kafka testing"
      # decision (integration tests use a real Postgres, never a real Kafka broker) — Docker is
      # preinstalled on ubuntu-latest GitHub-hosted runners, so this needs no extra setup step.
      - name: Integration tests
        run: dotnet test tests/InvoiceTracker.IntegrationTests/InvoiceTracker.IntegrationTests.csproj --no-build --configuration Release

  build-and-push-image:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image name/tag matches what k8s/api/deployment.yaml already references
      # (ghcr.io/emilioc2/invoice-tracker-api:latest) — github.repository_owner resolves to the
      # same value dynamically rather than hardcoding it.
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/invoice-tracker-api:latest
            ghcr.io/${{ github.repository_owner }}/invoice-tracker-api:${{ github.sha }}
